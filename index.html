<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>מרוץ לדירה 🏠</title>
<script>
  window.addEventListener('error', function(e){
    if(document.getElementById('fatalError')) return;
    var detail = (e && e.message ? e.message : 'לא ידוע');
    var loc = (e && e.filename ? e.filename.split('/').pop() : '') + (e && e.lineno ? (':' + e.lineno + ':' + e.colno) : '');
    var el = document.createElement('div');
    el.id = 'fatalError';
    el.style.cssText = 'position:fixed;inset:0;z-index:999;background:#1c1030;color:#fff6ea;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;direction:rtl;';
    el.innerHTML =
      '<div style="font-size:40px;margin-bottom:10px;">⚠️</div>' +
      '<div style="font-weight:800;font-size:18px;margin-bottom:10px;">המשחק נתקל בשגיאה</div>' +
      '<div style="font-size:13px;opacity:.9;max-width:340px;line-height:1.6;margin-bottom:6px;background:rgba(255,255,255,.08);border-radius:10px;padding:12px;direction:ltr;text-align:left;word-break:break-word;">' + detail + '<br><span style="opacity:.6;">' + loc + '</span></div>' +
      '<div style="font-size:12px;opacity:.7;max-width:320px;line-height:1.5;margin-bottom:18px;">צלמו מסך של ההודעה הזו ושלחו אותה — כדי שנדע בדיוק מה לתקן.</div>' +
      '<button onclick="location.reload()" style="font-weight:800;font-size:16px;padding:12px 30px;border-radius:40px;border:none;background:linear-gradient(90deg,#ffc93c,#ff9d4d);color:#2b1400;">נסה שוב</button>';
    document.body.appendChild(el);
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --sunset-1:#ff8a5c;
    --sunset-2:#ff5f8f;
    --sunset-3:#5b3b8c;
    --ink:#1c1030;
    --paper:#fff6ea;
    --gold:#ffc93c;
    --mint:#2dd4a7;
    --danger:#ff4d5e;
    --card:#241938;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family:'Heebo', sans-serif; background:var(--ink);
    direction:rtl; touch-action:none; overscroll-behavior:none;
  }
  #gameCanvas{position:fixed; inset:0; display:block; width:100%; height:100%;}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; top:0; right:0; left:0; z-index:10;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 16px; pointer-events:none;
  }
  .pill{
    background:rgba(28,16,48,0.62); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:16px; padding:8px 16px; color:var(--paper);
    font-weight:800; font-size:15px; box-shadow:0 6px 18px rgba(0,0,0,0.25);
    display:flex; align-items:center; gap:8px; letter-spacing:.2px;
  }
  .pill .big{font-size:20px; font-variant-numeric:tabular-nums;}
  #comboWrap{position:fixed; top:70px; right:16px; z-index:10; pointer-events:none;}
  #combo{
    background:linear-gradient(90deg,var(--gold),#ff9d4d); color:#3a1e00;
    border-radius:12px; padding:4px 12px; font-weight:900; font-size:14px;
    opacity:0; transform:translateY(-6px) scale(.9); transition:opacity .18s, transform .18s;
    box-shadow:0 4px 12px rgba(255,180,50,.4);
  }
  #combo.show{opacity:1; transform:translateY(0) scale(1);}

  #soundBtn{
    position:fixed; top:14px; left:14px; z-index:20; pointer-events:auto;
    width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,0.16);
    background:rgba(28,16,48,0.62); color:var(--paper); font-size:19px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  /* ---------- Floating toast for pickups/hits ---------- */
  #toastLayer{position:fixed; inset:0; z-index:9; pointer-events:none; overflow:hidden;}
  .toast{
    position:absolute; font-weight:800; font-size:15px; white-space:nowrap;
    padding:5px 12px; border-radius:10px; transform:translate(-50%,-50%);
    animation:floatUp 0.9s ease-out forwards;
  }
  .toast.good{background:rgba(45,212,167,0.92); color:#053324;}
  .toast.bad{background:rgba(255,77,94,0.92); color:#3a0007;}
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,-40%) scale(.7);}
    15%{opacity:1; transform:translate(-50%,-60%) scale(1.08);}
    100%{opacity:0; transform:translate(-50%,-150%) scale(1);}
  }

  /* ---------- Screens ---------- */
  .screen{
    position:fixed; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:radial-gradient(120% 100% at 50% 0%, #3a2160 0%, #1c1030 70%);
    color:var(--paper);
  }
  .hidden{display:none !important;}
  .logo-emoji{font-size:56px; line-height:1; filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));}
  h1.title{
    font-size:clamp(28px,7vw,44px); font-weight:900; margin:8px 0 2px;
    background:linear-gradient(90deg,var(--gold),var(--sunset-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{font-size:15px; opacity:.85; max-width:340px; margin:0 0 22px; line-height:1.6; font-weight:600;}
  .btn{
    font-family:inherit; border:none; cursor:pointer; font-weight:900;
    font-size:19px; padding:16px 42px; border-radius:50px; color:#2b1400;
    background:linear-gradient(90deg,var(--gold),#ff9d4d);
    box-shadow:0 10px 24px rgba(255,160,60,.35), inset 0 -3px 0 rgba(0,0,0,.15);
    transition:transform .12s;
  }
  .btn:active{transform:scale(.95);}
  .btn.secondary{
    background:rgba(255,255,255,0.08); color:var(--paper);
    box-shadow:none; border:1px solid rgba(255,255,255,.25); font-size:15px; padding:11px 26px;
  }
  .howto{
    display:flex; gap:14px; margin:18px 0 26px; flex-wrap:wrap; justify-content:center; max-width:360px;
  }
  .howto div{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:14px; padding:10px 12px; font-size:12px; font-weight:700; width:96px;
  }
  .howto div .ic{font-size:22px; display:block; margin-bottom:4px;}
  .hi{font-size:13px; opacity:.75; margin-top:14px; font-weight:700;}

  #gameOverCard{max-width:380px; width:100%;}
  .go-line{font-size:16px; font-weight:700; line-height:1.7; margin:2px 0;}
  .go-punch{font-size:17px; font-weight:900; color:var(--gold); margin:6px 0 16px;}
  .statRow{
    display:flex; justify-content:space-between; gap:10px; width:100%; max-width:320px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    border-radius:16px; padding:14px 18px; margin:14px 0;
  }
  .statCol{display:flex; flex-direction:column; align-items:center; flex:1;}
  .statCol .n{font-size:20px; font-weight:900; font-variant-numeric:tabular-nums;}
  .statCol .l{font-size:11px; opacity:.7; font-weight:700; margin-top:2px;}
  .flavor{font-size:13px; opacity:.8; font-weight:600; margin-bottom:6px;}
  .newHi{color:var(--mint); font-weight:900; font-size:13px; margin-top:-6px; margin-bottom:10px;}

  /* ---------- Mobile controls ---------- */
  #mobileControls{
    position:fixed; bottom:0; left:0; right:0; z-index:15;
    display:none; justify-content:space-between; align-items:flex-end;
    padding:0 14px 18px; pointer-events:none; direction:ltr;
  }
  #mobileControls.active{display:flex;}
  .mc-side{display:flex; gap:10px; pointer-events:auto;}
  .mc-btn{
    width:58px; height:58px; border-radius:50%;
    background:rgba(28,16,48,0.55); border:1px solid rgba(255,255,255,.2);
    color:var(--paper); font-size:24px; display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  .mc-btn:active{background:rgba(255,180,50,.5);}
  .mc-jump{width:70px; height:70px; font-size:27px; margin-bottom:4px;}

  #swipeHint{
    position:fixed; bottom:100px; left:0; right:0; text-align:center; z-index:14;
    color:rgba(255,255,255,.55); font-size:12px; font-weight:700; pointer-events:none;
    display:none;
  }
</style>

<script>
(function(){
"use strict";

/* =========================================================
   מרוץ לדירה — Endless runner, satirical Israeli housing theme
   Single-file Three.js implementation, no backend.
========================================================= */

/* ---------------- Data: obstacles & collectibles ---------------- */
// action: 'dodge' (must change lane), 'jump' (low barrier), 'duck' (overhead barrier)
const EXPENSES = [
  {emoji:"🥩", text:"סטייק 180 ₪ לארוחת צהריים", action:"dodge", punch:"התפנקת על סטייק ב־180 ₪."},
  {emoji:"🚢", text:"קרוז בחו״ל 7,500 ₪", action:"jump", punch:"היית בקרוז מפנק בחו״ל."},
  {emoji:"🎤", text:"הופעה בגולדן רינג 600 ₪", action:"dodge", punch:"היית בגולדן רינג."},
  {emoji:"🍣", text:"סושי ויין – 320 ₪", action:"duck", punch:"נהנית מסושי ויין משובח."},
  {emoji:"🏨", text:"מלון מפנק לסופ״ש – 2,400 ₪", action:"jump", punch:"פינקת את עצמך בסופ״ש מלונאי."},
  {emoji:"☕", text:"קפה ומאפה כל בוקר – 35 ₪", action:"dodge", punch:"התחלת כל בוקר עם קפה ומאפה איכותי."},
  {emoji:"🛍️", text:"רק נכנסתי לקניון לקנות דבר אחד", action:"duck", punch:"יצאת מהקניון עם 5 שקיות."},
  {emoji:"🚕", text:"מונית כי לא היה כוח לאוטובוס", action:"dodge", punch:"הגעת בנוחות במונית."},
  {emoji:"🛋️", text:"איקאה - \"רק כמה דברים קטנים\"", action:"jump", punch:"הדירה השכורה נראית מעולה עכשיו."},
  {emoji:"👟", text:"נעליים חדשות כי \"היו במבצע\"", action:"dodge", punch:"קנית נעליים חדשות ב\"מבצע\"."},
  {emoji:"🍕", text:"משלוח פיצה בפעם השלישית השבוע", action:"duck", punch:"אכלת כמו מלך כל השבוע."},
  {emoji:"🎭", text:"כרטיסים להיכל התרבות", action:"dodge", punch:"נהנית מערב תרבות מפנק."},
  {emoji:"📱", text:"שדרוג לאייפון החדש", action:"jump", punch:"יש לך את הטלפון הכי חדש בשוק."},
  {emoji:"🎢", text:"יום כיף בפארק מים", action:"dodge", punch:"היה לך יום כיף בפארק מים."},
  {emoji:"🥑", text:"ארוחת בראנץ׳ זוגית – 250 ₪", action:"duck", punch:"נהנית מבראנץ׳ מפנק עם אבוקדו."}
];

const SAVINGS = [
  {emoji:"👨‍👩‍👧", text:"שבת אצל ההורים – אוכל חינם"},
  {emoji:"🥪", text:"טוסט לארוחת צהריים – 12 ₪"},
  {emoji:"🏷️", text:"מבצע 1+1"},
  {emoji:"🎟️", text:"קופון 30% הנחה"},
  {emoji:"🍝", text:"אכלתי בבית"},
  {emoji:"🛒", text:"קניתי במבצע"},
  {emoji:"🚶", text:"הלכתי ברגל במקום מונית"},
  {emoji:"💰", text:"חסכתי 50 ₪"},
  {emoji:"🚫☕", text:"תרמוס מהבית במקום קפה בחוץ"},
  {emoji:"👕", text:"בגדים יד שנייה"},
  {emoji:"✂️", text:"ביטלתי מנוי שלא השתמשתי בו"},
  {emoji:"🏦", text:"פיקדון בריבית טובה"},
  {emoji:"💪", text:"עבודה נוספת בסופ״ש"},
  {emoji:"📦", text:"מכרתי דברים ישנים ביד2"},
  {emoji:"🎁", text:"תלוש מתנה מהעבודה"}
];

/* ---------------- Constants ---------------- */
const LANE_WIDTH = 2.6;
const LANES = [-LANE_WIDTH, 0, LANE_WIDTH];
const GRAVITY = 19;
const JUMP_VELOCITY = 11.5;
const SLIDE_DURATION = 0.55;
const SPAWN_Z = -70;
const DESPAWN_Z = 6;
const BASE_SPEED = 13;
const MAX_SPEED = 34;
const LANE_LERP = 12;

/* ---------------- Utility ---------------- */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function fmtTime(s){
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}
function fmtNum(n){ return Math.floor(n).toLocaleString("he-IL"); }

/* ---------------- Canvas texture helpers ---------------- */
function makeCanvas(w,h){
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function labelTexture(emoji, text, kind){
  // kind: 'expense' | 'saving' — clean glowing emoji badge, no wrapped text (unreadable at speed)
  const c = makeCanvas(256,256);
  const ctx = c.getContext("2d");
  const good = kind !== "expense";
  const main = good ? "#2dd4a7" : "#ff4d5e";
  const dark = good ? "#0f9c78" : "#b8202f";
  const cx=128, cy=124;

  // soft outer glow
  const glow = ctx.createRadialGradient(cx,cy,30,cx,cy,126);
  glow.addColorStop(0, hexAlpha(main,0.55));
  glow.addColorStop(1, hexAlpha(main,0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx,cy,126,0,Math.PI*2); ctx.fill();

  // solid badge
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.4)"; ctx.shadowBlur=16; ctx.shadowOffsetY=8;
  ctx.beginPath(); ctx.arc(cx,cy,88,0,Math.PI*2);
  ctx.fillStyle = main; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,88,0,Math.PI*2);
  ctx.strokeStyle = dark; ctx.lineWidth=8; ctx.stroke();
  // inner ring accent
  ctx.beginPath(); ctx.arc(cx,cy,72,0,Math.PI*2);
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth=3; ctx.stroke();

  // big emoji
  ctx.font = "112px 'Noto Color Emoji','Apple Color Emoji',sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(emoji, cx, cy+4);

  // small +/- indicator badge corner
  ctx.beginPath(); ctx.arc(cx+70,cy-70,26,0,Math.PI*2);
  ctx.fillStyle = good ? "#0f9c78" : "#b8202f"; ctx.fill();
  ctx.strokeStyle="#fff"; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle="#fff"; ctx.font="900 34px Heebo, sans-serif";
  ctx.fillText(good ? "+" : "×", cx+70, cy-68);

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
function hexAlpha(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const words = text.split(" ");
  let line = "";
  let lines = [];
  for(let i=0;i<words.length;i++){
    const test = line ? line+" "+words[i] : words[i];
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line); line = words[i];
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);
  if(lines.length>maxLines){
    lines = lines.slice(0,maxLines);
    lines[maxLines-1] += "…";
  }
  const startY = y - (lines.length-1)*lineHeight/2;
  lines.forEach((l,i)=> ctx.fillText(l, x, startY + i*lineHeight));
}

function signTexture(text, sub, colorA, colorB){
  const c = makeCanvas(520,300);
  const ctx = c.getContext("2d");
  const grad = ctx.createLinearGradient(0,0,0,300);
  grad.addColorStop(0,colorA); grad.addColorStop(1,colorB);
  roundRect(ctx,10,10,500,280,28);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.65)"; ctx.lineWidth=8; ctx.stroke();
  // corner bolts
  ctx.fillStyle="rgba(255,255,255,0.55)";
  [[35,35],[485,35],[35,265],[485,265]].forEach(p=>{
    ctx.beginPath(); ctx.arc(p[0],p[1],7,0,Math.PI*2); ctx.fill();
  });
  ctx.direction="rtl"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#fff";
  ctx.font="900 76px Heebo, sans-serif";
  ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=8;
  ctx.fillText(text, 260, sub? 118:150);
  if(sub){
    ctx.font="700 34px Heebo, sans-serif";
    ctx.fillText(sub, 260, 190);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function buildingTexture(seed){
  const w=256,h=512;
  const c = makeCanvas(w,h);
  const ctx = c.getContext("2d");
  const hues = ["#3a2f57","#4a3568","#2f3a5c","#553a5c","#37456b"];
  ctx.fillStyle = hues[seed % hues.length];
  ctx.fillRect(0,0,w,h);
  // windows grid
  const cols=6, rows=14;
  const mw = w/cols, mh = h/rows;
  for(let r=0;r<rows;r++){
    for(let cI=0;cI<cols;cI++){
      const lit = Math.random() < 0.35;
      ctx.fillStyle = lit ? "rgba(255,214,120,0.85)" : "rgba(15,10,30,0.55)";
      ctx.fillRect(cI*mw+mw*0.22, r*mh+mh*0.28, mw*0.56, mh*0.5);
    }
  }
  if(seed % 3 === 0){
    ctx.save();
    ctx.translate(w/2, h*0.12);
    ctx.rotate(0);
    roundRect(ctx,-95,-30,190,60,8);
    ctx.fillStyle="#1e63c7"; ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=3; ctx.stroke();
    ctx.direction="rtl"; ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="900 30px Heebo, sans-serif";
    ctx.fillText("להשכרה", 0, 2);
    ctx.restore();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function dreamBuildingTexture(){
  const w=220,h=380;
  const c = makeCanvas(w,h);
  const ctx = c.getContext("2d");
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"#fff3d8"); grad.addColorStop(1,"#ffcf82");
  ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
  const cols=4, rows=9;
  const mw=w/cols, mh=h/rows;
  for(let r=0;r<rows;r++){
    for(let cI=0;cI<cols;cI++){
      ctx.fillStyle = "rgba(255,255,255,0.65)";
      roundRect(ctx, cI*mw+mw*0.16, r*mh+mh*0.22, mw*0.68, mh*0.56, 4);
      ctx.fill();
      ctx.strokeStyle="rgba(160,95,40,0.55)"; ctx.lineWidth=2;
      ctx.stroke();
    }
  }
  ctx.fillStyle="rgba(255,255,255,0.3)";
  ctx.fillRect(0,0,w,10);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function roadTexture(){
  const w=256,h=1024;
  const c = makeCanvas(w,h);
  const ctx = c.getContext("2d");
  ctx.fillStyle="#2b2a33"; ctx.fillRect(0,0,w,h);
  for(let i=0;i<h;i+=4){
    ctx.fillStyle = Math.random()>0.5 ? "rgba(255,255,255,0.015)" : "rgba(0,0,0,0.02)";
    ctx.fillRect(0,i,w,2);
  }
  ctx.fillStyle="#e8c94a";
  const laneXs=[w*0.333, w*0.667];
  laneXs.forEach(lx=>{
    for(let y=0;y<h;y+=70){
      ctx.fillRect(lx-4, y, 8, 40);
    }
  });
  ctx.fillStyle="rgba(255,255,255,0.85)";
  ctx.fillRect(6,0,5,h); ctx.fillRect(w-11,0,5,h);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 18);
  return tex;
}

/* ---------------- Character sprite (procedural, animated) ---------------- */
function makeCharacterCanvas(){
  const c = makeCanvas(220,260);
  return c;
}
function drawCharacter(ctx, phase, state){
  // state: run, jump, slide, hit
  ctx.clearRect(0,0,220,260);
  ctx.save();
  ctx.translate(110, 220);

  const skin = "#f2b98d";
  const shirt = "#2f7ff0";
  const shirt2 = "#1c5fd0";
  const pants = "#2a2438";
  const hair = "#241a12";

  let legSwing = Math.sin(phase)*0.62;
  let armSwing = Math.sin(phase)*0.55;
  let bodyTilt = 0;
  let squat = 0;
  let headBob = Math.abs(Math.sin(phase))*4;

  if(state==="jump"){ legSwing=0.25; armSwing=-0.6; squat=0; bodyTilt=-0.08; headBob=-14;}
  if(state==="slide"){ squat=48; bodyTilt=0; legSwing=0; armSwing=0.2; headBob=0;}
  if(state==="hit"){ bodyTilt=0.5; legSwing=0; armSwing=-1.1; }

  ctx.translate(0, squat);
  ctx.rotate(bodyTilt);

  // shadow
  ctx.save();
  ctx.globalAlpha=0.28;
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.ellipse(0, 4, 42-squat*0.3, 10, 0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  const legH = 70 - squat*0.7;

  // back leg
  ctx.save();
  ctx.translate(-10,-legH);
  ctx.rotate(-legSwing);
  ctx.fillStyle = pants;
  roundRect(ctx,-11,0,22,legH,10); ctx.fill();
  ctx.fillStyle="#3a3550";
  roundRect(ctx,-13,legH-14,26,16,7); ctx.fill();
  ctx.restore();

  // back arm
  ctx.save();
  ctx.translate(-24,-118);
  ctx.rotate(-armSwing*0.8);
  ctx.fillStyle=shirt2;
  roundRect(ctx,-9,0,18,58,9); ctx.fill();
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.arc(0,58,9,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // front leg
  ctx.save();
  ctx.translate(10,-legH);
  ctx.rotate(legSwing);
  ctx.fillStyle = "#332c48";
  roundRect(ctx,-11,0,22,legH,10); ctx.fill();
  ctx.fillStyle="#4a4468";
  roundRect(ctx,-13,legH-14,26,16,7); ctx.fill();
  ctx.restore();

  // torso
  ctx.save();
  ctx.translate(0,-120-headBob*0.1);
  const torsoH = 68 - squat*0.4;
  const grad = ctx.createLinearGradient(0,-torsoH,0,0);
  grad.addColorStop(0,shirt); grad.addColorStop(1,shirt2);
  ctx.fillStyle=grad;
  roundRect(ctx,-26,-torsoH,52,torsoH,16); ctx.fill();
  // backpack hint
  ctx.fillStyle="#d94f4f";
  roundRect(ctx,10,-torsoH+8,14,torsoH-16,6); ctx.fill();
  ctx.restore();

  // front arm
  ctx.save();
  ctx.translate(24,-118);
  ctx.rotate(armSwing*0.8);
  ctx.fillStyle=shirt;
  roundRect(ctx,-9,0,18,58,9); ctx.fill();
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.arc(0,58,9,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // head
  ctx.save();
  ctx.translate(0,-176-headBob*0.2);
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fill();
  // hair
  ctx.fillStyle=hair;
  ctx.beginPath();
  ctx.arc(0,-4,27,Math.PI*1.05,Math.PI*1.95);
  ctx.fill();
  // face
  if(state==="hit"){
    ctx.strokeStyle="#3a1f1f"; ctx.lineWidth=3; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(-10,-2); ctx.lineTo(-2,6); ctx.moveTo(-2,-2); ctx.lineTo(-10,6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2,-2); ctx.lineTo(10,6); ctx.moveTo(10,-2); ctx.lineTo(2,6); ctx.stroke();
    ctx.strokeStyle="#3a1f1f"; ctx.beginPath(); ctx.arc(0,14,6,0,Math.PI,true); ctx.stroke();
  } else {
    ctx.fillStyle="#241a12";
    ctx.beginPath(); ctx.arc(-8,-1,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8,-1,3,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#241a12"; ctx.lineWidth=2.5; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(0,6,7,0,Math.PI,false); ctx.stroke();
  }
  ctx.restore();

  ctx.restore();
}

/* ---------------- Web Audio (procedural SFX) ---------------- */
const Sound = {
  ctx:null, muted:true,
  init(){
    if(this.ctx) return;
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; }
  },
  beep(freq, dur, type, vol, glideTo){
    if(this.muted || !this.ctx) return;
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type||"sine";
    osc.frequency.setValueAtTime(freq, t0);
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0+dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol||0.22, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  },
  collect(){ this.beep(760,0.12,"triangle",0.25,1180); },
  hit(){ this.beep(180,0.35,"sawtooth",0.3,60); },
  jump(){ this.beep(420,0.12,"square",0.15,620); },
  gameover(){
    if(this.muted || !this.ctx) return;
    [520,420,320,220].forEach((f,i)=>{
      setTimeout(()=>this.beep(f,0.25,"triangle",0.22), i*130);
    });
  },
  combo(level){ this.beep(600+level*60,0.1,"triangle",0.2,900+level*80); }
};

/* Touch: swipe + buttons */
let touchStartX=0, touchStartY=0, touchActive=false;
canvas.addEventListener("touchstart", (e)=>{
  const t = e.changedTouches[0];
  touchStartX = t.clientX; touchStartY = t.clientY; touchActive=true;
}, {passive:true});
canvas.addEventListener("touchend", (e)=>{
  if(!touchActive) return;
  touchActive=false;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 34){
    if(dx>0) moveLane(1); else moveLane(-1);
  } else if(dy < -34){
    doJump();
  } else if(dy > 34){
    doSlide();
  }
}, {passive:true});

  const slot = obstaclePool.find(o=>!o.active);
  if(!slot) return;
  const idx = Math.floor(Math.random()*EXPENSES.length);
  const data = EXPENSES[idx];
  slot.data = data; slot.dataIdx = idx;
  slot.active = true; slot.avoided = false;
  let lane = Math.floor(Math.random()*3);
  if(data.action==="dodge"){
    // never let a "must change lane" obstacle occupy all 3 lanes at once —
    // always guarantee at least one lane free of dodge-obstacles
    const dodgeLanes = new Set(
      obstaclePool.filter(o=>o.active && o.data && o.data.action==="dodge").map(o=>o.lane)
    );
    if(dodgeLanes.size >= 2 && !dodgeLanes.has(lane)){
      const arr = Array.from(dodgeLanes);
      lane = arr[Math.floor(Math.random()*arr.length)];
    }
  }
  slot.lane = lane;
  slot.z = SPAWN_Z;
  slot.sprite.material.map = getExpenseTex(idx);
  slot.sprite.material.needsUpdate = true;
  slot.sprite.visible = true;
  if(data.action==="jump"){ slot.y = 0.55; slot.sprite.scale.set(1.6,1.6,1); }
  else if(data.action==="duck"){ slot.y = 2.5; slot.sprite.scale.set(1.7,1.7,1); }
  else { slot.y = 1.25; slot.sprite.scale.set(2.0,2.0,1); }
  positionEntity(slot);
}
function spawnCollectible(lane, zOverride){
  const slot = collectPool.find(o=>!o.active);
  if(!slot) return;
  const idx = Math.floor(Math.random()*SAVINGS.length);
  slot.data = SAVINGS[idx]; slot.dataIdx = idx;
  slot.active = true; slot.avoided = false;
  slot.lane = lane!==undefined ? lane : Math.floor(Math.random()*3);
  slot.z = zOverride!==undefined ? zOverride : SPAWN_Z;
  slot.y = 1.35;
  slot.sprite.material.map = getSavingTex(idx);
  slot.sprite.material.needsUpdate = true;
  slot.sprite.visible = true;
  slot.sprite.scale.set(1.6,1.6,1);
  positionEntity(slot);
}
function positionEntity(e){
  e.sprite.position.set(LANES[e.lane], e.y, e.z);
}

/* ---------------- Reset / Start ---------------- */
function resetGame(){
  G.distance=0; G.score=0; G.timeAlive=0; G.speed=BASE_SPEED;
  G.laneIdx=1; G.laneX=0; G.playerY=0; G.vy=0;
  G.isJumping=false; G.isSliding=false; G.slideTimer=0;
  G.spawnTimer=0; G.spawnInterval=0.95;
  G.combo=0; G.comboTimer=0; G.charPhase=0;
  obstaclePool.forEach(o=>{o.active=false; o.sprite.visible=false;});
  collectPool.forEach(o=>{o.active=false; o.sprite.visible=false;});
  buildings.forEach((b,i)=>{ b.mesh.position.z = -i*BUILD_SPACING; });
  document.getElementById("scoreVal").textContent = "0";
  document.getElementById("timeVal").textContent = "00:00";
}

function startGame(){
  resetGame();
  G.running = true;
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
  G.lastTime = performance.now();
  requestAnimationFrame(loop);
}

function endGame(hitData){
  G.running = false;
  Sound.hit();
  setTimeout(()=>Sound.gameover(), 120);
  document.getElementById("hud").classList.add("hidden");

  const isNewHi = G.score > G.hi;
  if(isNewHi){
    G.hi = Math.floor(G.score);
    try{ localStorage.setItem("dira_runner_highscore", String(G.hi)); }catch(e){}
  }

  document.getElementById("goTime").textContent = fmtTime(G.timeAlive);
  document.getElementById("goScore").textContent = fmtNum(G.score);
  document.getElementById("goDist").textContent = fmtNum(G.distance) + " מ׳";
  document.getElementById("hiScore").textContent = fmtNum(G.hi);
  document.getElementById("newHiTag").classList.toggle("hidden", !isNewHi);

  const remaining = Math.floor(40 + G.distance*0.35 + Math.random()*30);
  document.getElementById("goFlavor").textContent = "הדירה התרחקה בעוד " + remaining + " מטר.";

  if(hitData){
    document.getElementById("goEmoji").textContent = hitData.emoji;
    document.getElementById("goPunch").textContent = "...אבל לפחות " + hitData.punch;
  } else {
    document.getElementById("goEmoji").textContent = "😅";
    document.getElementById("goPunch").textContent = "...אבל לפחות ניסית.";
  }

  document.getElementById("gameOverScreen").classList.remove("hidden");
}

document.getElementById("startBtn").addEventListener("click", ()=>{
  Sound.init();
  startGame();
});
document.getElementById("retryBtn").addEventListener("click", ()=>{
  startGame();
});

/* ---------------- Combo UI ---------------- */
const comboEl = document.getElementById("combo");
function bumpCombo(){
  G.combo++;
  G.comboTimer = 2.2;
  if(G.combo>=2){
    comboEl.textContent = "Combo x" + G.combo + "! 🔥";
    comboEl.classList.add("show");
    Sound.combo(G.combo);
  }
}
function resetCombo(){
  G.combo = 0;
  comboEl.classList.remove("show");
}

/* ---------------- Main loop ---------------- */
function loop(now){
  if(!G.running) return;
  let dt = (now - G.lastTime)/1000;
  dt = Math.min(dt, 0.05);
  G.lastTime = now;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

function update(dt){
  G.timeAlive += dt;
  G.speed = clamp(BASE_SPEED + G.distance*0.045, BASE_SPEED, MAX_SPEED);
  G.distance += G.speed*dt;
  G.score += G.speed*dt*10 + dt*2; // ~10 pts/meter baseline + trickle
  G.spawnInterval = clamp(0.95 - G.distance*0.0028, 0.42, 0.95);

  // lane movement (smooth)
  const targetX = LANES[G.laneIdx];
  G.laneX += (targetX - G.laneX) * Math.min(1, LANE_LERP*dt);

  // jump physics
  if(G.isJumping){
    G.vy -= GRAVITY*dt;
    G.playerY += G.vy*dt;
    if(G.playerY <= 0){ G.playerY = 0; G.isJumping=false; G.vy=0; }
  }
  // slide timer
  if(G.isSliding){
    G.slideTimer -= dt;
    if(G.slideTimer<=0){ G.isSliding=false; }
  }

  // combo timer decay
  if(G.combo>0){
    G.comboTimer -= dt;
    if(G.comboTimer<=0) resetCombo();
  }

  // spawn logic
  G.spawnTimer -= dt;
  if(G.spawnTimer<=0){
    G.spawnTimer = G.spawnInterval;
    const roll = Math.random();
    if(roll < 0.62){
      spawnObstacle();
      if(Math.random()<0.4){
        const freeLane = Math.floor(Math.random()*3);
        spawnCollectible(freeLane, SPAWN_Z - 4 - Math.random()*4);
      }
    } else {
      spawnCollectible();
    }
  }

  // move entities & collision
  processEntities(obstaclePool, dt, true);
  processEntities(collectPool, dt, false);

  // apartment sign recedes as distance grows
  const aptDist = 55 + G.distance*0.55;
  aptSign.position.z = -aptDist;
  aptSign.position.x = Math.sin(G.distance*0.01)*1.2;

  // buildings recycle
  buildings.forEach(b=>{
    b.mesh.position.z += G.speed*dt;
    if(b.mesh.position.z > 12){
      b.mesh.position.z -= BUILD_COUNT*BUILD_SPACING;
    }
  });

  // road scroll
  roadTex.offset.y -= (G.speed*dt)*0.045;

  // player group position
  playerGroup.position.x = G.laneX;
  playerGroup.position.y = 0;

  // character animation state + sprite redraw
  let state = "run";
  if(G.isJumping) state="jump";
  else if(G.isSliding) state="slide";
  G.charPhase += dt * (10 + G.speed*0.35);
  const ctx = charCanvas.getContext("2d");
  drawCharacter(ctx, G.charPhase, state);
  charTex.needsUpdate = true;

  charSprite.position.y = 1.5 + G.playerY;
  const baseScaleY = state==="slide" ? 2.15 : 3.05;
  charSprite.scale.set(2.6, baseScaleY, 1);

  blob.position.x = 0;
  blob.material.opacity = clamp(1 - G.playerY*0.35, 0.15, 1);

  // camera follow (slight lane lag + bob)
  camera.position.x += (G.laneX*0.5 - camera.position.x + CAM_OFFSET.x)*Math.min(1,6*dt);
  camera.position.y = CAM_OFFSET.y + Math.sin(G.charPhase*0.5)*0.05;
  camera.lookAt(G.laneX*0.3, 1.6 + G.playerY*0.3, -4);

  // sun/sky drift subtle
  sun.position.x = Math.sin(G.distance*0.002)*4;

  // HUD
  document.getElementById("scoreVal").textContent = fmtNum(G.score);
  document.getElementById("timeVal").textContent = fmtTime(G.timeAlive);
}

function processEntities(pool, dt, isObstacle){
  for(const e of pool){
    if(!e.active) continue;
    e.z += G.speed*dt;
    positionEntity(e);

    // gentle bob/spin for visual life
    e.sprite.material.rotation += dt*0.6;

    // hit/collect window scales with speed so real-time reaction window stays constant (~0.3s)
    const winZ = G.speed * 0.15;

    if(isObstacle){
      if(e.z > -winZ && e.z < winZ && e.lane===G.laneIdx){
        const action = e.data.action;
        let hit = true;
        if(action==="jump" && G.isJumping && G.playerY > 0.4) hit=false;
        if(action==="duck" && G.isSliding) hit=false;
        if(action==="dodge") hit=true;
        if(hit){
          deactivate(e);
          endGame(e.data);
          return;
        } else if(!e.avoided && e.z > 0){
          // successfully avoided a jump/duck obstacle in same lane
          e.avoided = true;
          G.score += 40;
          bumpCombo();
          spawnToast("✅ נמנעת!", true);
        }
      }
      if(e.z > DESPAWN_Z){
        if(e.lane!==G.laneIdx){ G.score += 15; } // dodged by lane change
        deactivate(e);
      }
    } else {
      if(e.z > -winZ && e.z < winZ && e.lane===G.laneIdx){
        G.score += 60;
        bumpCombo();
        spawnToast(e.data.emoji+" +60", true);
        Sound.collect();
        deactivate(e);
        continue;
      }
      if(e.z > DESPAWN_Z){ deactivate(e); }
    }
  }
}

function deactivate(e){
  e.active=false; e.sprite.visible=false; e.z=-999; e.sprite.position.z=-999;
}

function render(){
  renderer.render(scene, camera);
}

/* Idle render loop before game starts (for background ambience on start screen) */
let idlePhase=0;
function idleLoop(now){
  if(G.running) return;
  idlePhase += 0.016;
  buildings.forEach(b=>{
    b.mesh.position.z += 0.05;
    if(b.mesh.position.z > 12) b.mesh.position.z -= BUILD_COUNT*BUILD_SPACING;
  });
  roadTex.offset.y -= 0.002;
  const ctx = charCanvas.getContext("2d");
  drawCharacter(ctx, idlePhase*3, "run");
  charTex.needsUpdate = true;
  camera.lookAt(0,1.6,-4);
  render();
  requestAnimationFrame(idleLoop);
}
requestAnimationFrame(idleLoop);

})();
</script>
